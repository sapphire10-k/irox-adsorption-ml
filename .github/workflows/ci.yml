name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (bundled fixtures only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately pip, not conda, and deliberately no xtb. Every test in this
      # suite runs against the fixtures bundled under tests/fixtures/ and the
      # small synthetic trees the tests build in tmp_path. Nothing here touches
      # the semi-empirical calculator, Quantum ESPRESSO, or any local run folder,
      # so CI needs none of that and stays fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "pandas==2.2.2" \
            "scikit-learn==1.5.1" \
            "matplotlib==3.9.1" \
            "ase==3.23.0" \
            "pytest==8.3.2"

      - name: Show versions
        run: python -c "import numpy, pandas, sklearn, matplotlib, ase; print(numpy.__version__, pandas.__version__, sklearn.__version__, matplotlib.__version__, ase.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q --durations=10

      # The README's numbers are generated, so a stale README is a real defect.
      # This regenerates it from the committed results tables and fails if the
      # result differs from what is checked in.
      - name: Check README is in sync with the committed results
        run: |
          cp README.md /tmp/README.committed.md
          python -m src.build_readme --out README.md
          diff -u /tmp/README.committed.md README.md \
            || { echo "::error::README.md is stale. Run 'python src/build_readme.py' and commit the result."; exit 1; }
